apiVersion: batch/v1
kind: Job
metadata:
  name: my-first-job
spec:
  completions: 1
  parallelism: 1
  template:
    spec:
      containers:
      - name: hello-container
        image: busybox
        command: ["sh", "-c", "echo Hello Kubernetes; sleep 10; echo Job Completed"]
      restartPolicy: Never
